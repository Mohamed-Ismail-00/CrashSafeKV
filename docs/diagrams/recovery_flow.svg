<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" width="900" height="960" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6574"/>
    </marker>
    <style>
      .p   { fill: #f4f6f9; stroke: #5b6574; stroke-width: 1.3; }
      .d   { fill: #e8f0fd; stroke: #3b6fd8; stroke-width: 1.3; }
      .end { fill: #eaf6ef; stroke: #3b8f60; stroke-width: 1.3; }
      .err { fill: #fdf1ec; stroke: #c4573a; stroke-width: 1.3; }
      .t   { font-size: 13.5px; fill: #1d2330; }
      .b   { font-size: 13.5px; font-weight: 600; fill: #1d2330; }
      .y   { font-size: 12px; fill: #3b6fd8; font-weight: 600; }
      .l   { stroke: #5b6574; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <text x="450" y="26" text-anchor="middle" class="b" font-size="17">Opening the store and recovering from a crash</text>

  <!-- start and setup -->
  <rect class="end" x="230" y="44" width="240" height="40" rx="20"/>
  <text x="350" y="69" text-anchor="middle" class="b">cskv_open(data_dir)</text>
  <path class="l" d="M350,84 L350,106"/>

  <rect class="p" x="210" y="108" width="280" height="44" rx="4"/>
  <text x="350" y="128" text-anchor="middle" class="t">create data dir, take cskv.lock</text>
  <text x="350" y="145" text-anchor="middle" class="t">(held by another process: ERR_LOCKED)</text>
  <path class="l" d="M350,152 L350,174"/>

  <rect class="p" x="210" y="176" width="280" height="44" rx="4"/>
  <text x="350" y="196" text-anchor="middle" class="t">delete leftover cskv.log.tmp</text>
  <text x="350" y="213" text-anchor="middle" class="t">(crashed compaction: old log is valid)</text>
  <path class="l" d="M350,220 L350,244"/>

  <!-- new store? -->
  <polygon class="d" points="350,246 480,286 350,326 220,286"/>
  <text x="350" y="283" text-anchor="middle" class="t">cskv.log missing</text>
  <text x="350" y="300" text-anchor="middle" class="t">or empty?</text>
  <path class="l" d="M480,286 L620,286"/>
  <text x="535" y="278" class="y">yes</text>
  <rect class="p" x="622" y="264" width="240" height="44" rx="4"/>
  <text x="742" y="291" text-anchor="middle" class="t">write 8-byte header, commit</text>
  <path class="l" d="M840,308 L840,878"/>
  <path class="l" d="M350,326 L350,350"/>
  <text x="358" y="342" class="y">no</text>

  <!-- header check -->
  <polygon class="d" points="350,352 480,392 350,432 220,392"/>
  <text x="350" y="389" text-anchor="middle" class="t">header magic and</text>
  <text x="350" y="406" text-anchor="middle" class="t">version valid?</text>
  <path class="l" d="M220,392 L130,392 L130,414"/>
  <text x="160" y="384" class="y">no</text>
  <rect class="err" x="30" y="416" width="200" height="40" rx="4"/>
  <text x="130" y="441" text-anchor="middle" class="b">ERR_BAD_FORMAT</text>
  <path class="l" d="M350,432 L350,456"/>
  <text x="358" y="449" class="y">yes</text>

  <rect class="p" x="230" y="458" width="240" height="36" rx="4"/>
  <text x="350" y="481" text-anchor="middle" class="t">offset = 8</text>
  <path class="l" d="M350,494 L350,518"/>

  <!-- replay loop -->
  <polygon class="d" points="350,520 460,556 350,592 240,556"/>
  <text x="350" y="561" text-anchor="middle" class="t">bytes left?</text>
  <path class="l" d="M460,556 L780,556 L780,878"/>
  <text x="560" y="548" class="y">no: clean end of file</text>
  <path class="l" d="M350,592 L350,614"/>
  <text x="358" y="607" class="y">yes</text>

  <rect class="p" x="200" y="616" width="300" height="44" rx="4"/>
  <text x="350" y="636" text-anchor="middle" class="t">read record at offset, check the</text>
  <text x="350" y="653" text-anchor="middle" class="t">7 rules (length, CRC32, type, ...)</text>
  <path class="l" d="M350,660 L350,682"/>

  <polygon class="d" points="350,684 440,716 350,748 260,716"/>
  <text x="350" y="721" text-anchor="middle" class="t">valid?</text>
  <path class="l" d="M440,716 L558,716"/>
  <text x="470" y="708" class="y">no</text>
  <rect class="err" x="560" y="680" width="200" height="96" rx="4"/>
  <text x="660" y="702" text-anchor="middle" class="b">corruption found</text>
  <text x="660" y="722" text-anchor="middle" class="t">save reason + offset,</text>
  <text x="660" y="740" text-anchor="middle" class="t">truncate the file to</text>
  <text x="660" y="758" text-anchor="middle" class="t">offset, commit</text>
  <path class="l" d="M660,776 L660,878"/>

  <path class="l" d="M350,748 L350,772"/>
  <text x="358" y="765" class="y">yes</text>
  <rect class="p" x="200" y="774" width="300" height="76" rx="4"/>
  <text x="350" y="796" text-anchor="middle" class="t">SET: put key/value in the table</text>
  <text x="350" y="814" text-anchor="middle" class="t">DEL: remove the key</text>
  <text x="350" y="832" text-anchor="middle" class="t">offset += 8 + body_len</text>
  <path class="l" d="M200,812 L150,812 L150,556 L238,556"/>
  <text x="70" y="690" class="y">next record</text>

  <!-- end -->
  <rect class="end" x="600" y="880" width="270" height="56" rx="28"/>
  <text x="735" y="903" text-anchor="middle" class="b">report recovery info</text>
  <text x="735" y="922" text-anchor="middle" class="t">open cskv.log for appending</text>
</svg>

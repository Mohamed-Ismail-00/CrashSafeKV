<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6574"/>
    </marker>
    <style>
      .p   { fill: #f4f6f9; stroke: #5b6574; stroke-width: 1.3; }
      .k   { fill: #e8f0fd; stroke: #3b6fd8; stroke-width: 1.5; }
      .ok  { fill: #eaf6ef; stroke: #3b8f60; stroke-width: 1.3; }
      .n   { fill: #fffaf0; stroke: #c9a24a; stroke-width: 1.2; }
      .t   { font-size: 13.5px; fill: #1d2330; }
      .b   { font-size: 14px; font-weight: 600; fill: #1d2330; }
      .num { font-size: 12px; font-weight: 700; fill: #3b6fd8; }
      .s   { font-size: 12.5px; fill: #4a5363; }
      .l   { stroke: #5b6574; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <!-- left: durable write -->
  <text x="230" y="30" text-anchor="middle" class="b" font-size="17">SET / DEL  (sync = always)</text>

  <rect class="p" x="80" y="50"  width="300" height="38" rx="4"/><text x="96" y="74" class="num">1</text><text x="240" y="74" text-anchor="middle" class="t">validate key / value lengths</text>
  <path class="l" d="M230,88 L230,104"/>
  <rect class="p" x="80" y="106" width="300" height="38" rx="4"/><text x="96" y="130" class="num">2</text><text x="240" y="130" text-anchor="middle" class="t">encode record into one buffer</text>
  <path class="l" d="M230,144 L230,160"/>
  <rect class="p" x="80" y="162" width="300" height="38" rx="4"/><text x="96" y="186" class="num">3</text><text x="240" y="186" text-anchor="middle" class="t">fwrite the whole buffer</text>
  <path class="l" d="M230,200 L230,216"/>
  <rect class="p" x="80" y="218" width="300" height="38" rx="4"/><text x="96" y="242" class="num">4</text><text x="240" y="242" text-anchor="middle" class="t">fflush: bytes reach the OS</text>
  <path class="l" d="M230,256 L230,272"/>
  <rect class="k" x="80" y="274" width="300" height="38" rx="4"/><text x="96" y="298" class="num">5</text><text x="240" y="298" text-anchor="middle" class="t">_commit: bytes reach the disk</text>
  <path class="l" d="M230,312 L230,328"/>
  <rect class="p" x="80" y="330" width="300" height="38" rx="4"/><text x="96" y="354" class="num">6</text><text x="240" y="354" text-anchor="middle" class="t">update the hash table</text>
  <path class="l" d="M230,368 L230,384"/>
  <rect class="ok" x="80" y="386" width="300" height="38" rx="19"/><text x="96" y="410" class="num">7</text><text x="240" y="410" text-anchor="middle" class="b">return OK</text>

  <rect class="n" x="40" y="450" width="380" height="120" rx="4"/>
  <text x="56" y="474" class="b">Why this order</text>
  <text x="56" y="496" class="s">OK is returned only after the record is on disk,</text>
  <text x="56" y="514" class="s">so acknowledged data survives a crash or power loss.</text>
  <text x="56" y="536" class="s">If steps 3-5 fail, the file is cut back to its old size,</text>
  <text x="56" y="554" class="s">the table is not touched and ERR_IO is returned.</text>

  <!-- right: compaction -->
  <text x="740" y="30" text-anchor="middle" class="b" font-size="17">COMPACT  (and RESTORE)</text>

  <rect class="p" x="560" y="50"  width="360" height="52" rx="4"/><text x="576" y="74" class="num">1</text>
  <text x="745" y="72" text-anchor="middle" class="t">write cskv.log.tmp: header +</text>
  <text x="745" y="90" text-anchor="middle" class="t">one SET per live key</text>
  <path class="l" d="M740,102 L740,118"/>
  <rect class="p" x="560" y="120" width="360" height="38" rx="4"/><text x="576" y="144" class="num">2</text><text x="745" y="144" text-anchor="middle" class="t">fflush + _commit + close the tmp file</text>
  <path class="l" d="M740,158 L740,174"/>
  <rect class="p" x="560" y="176" width="360" height="38" rx="4"/><text x="576" y="200" class="num">3</text><text x="745" y="200" text-anchor="middle" class="t">close the current log</text>
  <path class="l" d="M740,214 L740,230"/>
  <rect class="k" x="560" y="232" width="360" height="52" rx="4"/><text x="576" y="256" class="num">4</text>
  <text x="745" y="254" text-anchor="middle" class="t">MoveFileExA(tmp, cskv.log,</text>
  <text x="745" y="272" text-anchor="middle" class="t">REPLACE_EXISTING | WRITE_THROUGH)</text>
  <path class="l" d="M740,284 L740,300"/>
  <rect class="p" x="560" y="302" width="360" height="38" rx="4"/><text x="576" y="326" class="num">5</text><text x="745" y="326" text-anchor="middle" class="t">reopen cskv.log for appending</text>
  <path class="l" d="M740,340 L740,356"/>
  <rect class="ok" x="560" y="358" width="360" height="38" rx="19"/><text x="740" y="382" text-anchor="middle" class="b">log_records = live keys, dead = 0</text>

  <rect class="n" x="540" y="430" width="400" height="140" rx="4"/>
  <text x="556" y="454" class="b">Crash safety</text>
  <text x="556" y="476" class="s">Crash before step 4: cskv.log was never touched; the</text>
  <text x="556" y="494" class="s">half-written tmp file is deleted at the next open.</text>
  <text x="556" y="516" class="s">Crash after step 4: the new log is complete and committed.</text>
  <text x="556" y="538" class="s">The rename is atomic, so there is never a mix of both.</text>
  <text x="556" y="558" class="s">RESTORE validates the whole snapshot before step 1.</text>
</svg>
